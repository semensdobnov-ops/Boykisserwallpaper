name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip and check files
        run: |
          unzip BoyKisserWallpaper.zip -d project
          cd project
          echo "--- ЧТО ВНУТРИ ПАПКИ PROJECT ---"
          ls -la
          
          # Ищем папку, где лежит gradlew
          if [ -f "gradlew" ]; then echo "Нашел gradlew в корне"; 
          elif [ -f "*/gradlew" ]; then echo "Нашел gradlew в подпапке"; cd */; 
          else echo "ОШИБКА: gradlew не найден!"; exit 1; fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build with Gradle
        run: |
          cd project
          if [ -d "*/" ]; then cd */; fi
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BoyKisser-Wallpaper-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
